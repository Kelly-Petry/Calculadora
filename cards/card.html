<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#0f3d2b}
.card{position:relative;width:1080px;height:1350px;background:#0f3d2b}
.photo{position:absolute;top:0;left:0;width:1080px;height:760px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:var(--pos)}

.panel{position:absolute;top:560px;left:0;right:0;bottom:0;
 background:linear-gradient(rgba(15,61,43,0) 0,rgba(15,61,43,.85) 110px,#0f3d2b 170px,#0b2e20 100%)}
.frame{position:absolute;inset:28px;border:1.5px solid rgba(214,180,110,.75);pointer-events:none;z-index:5}
.spark{position:absolute;width:34px;height:34px;z-index:6}
.spark svg{width:100%;height:100%}
.badge{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:4;
 background:#0f3d2b;color:#f3ead8;font:500 22px Poppins;letter-spacing:.32em;padding:16px 34px 16px 40px;border:1.5px solid rgba(214,180,110,.8);white-space:nowrap}
.badge b{color:#d6b46e;font-weight:500}
.logo{position:absolute;top:84px;right:64px;text-align:center;color:#f3ead8;z-index:4;display:none}
.content{position:absolute;top:735px;left:90px;right:90px;text-align:center;color:#f3ead8;z-index:4}
.kick{font:400 21px Poppins;letter-spacing:.42em;color:#d6b46e;text-transform:uppercase}
.rule{display:flex;align-items:center;justify-content:center;gap:18px;margin:0 0 34px}
.rule i{display:block;width:120px;height:1px;background:rgba(214,180,110,.7)}
.rule s{width:9px;height:9px;background:#d6b46e;transform:rotate(45deg)}
h1{font:400 74px/1.08 'Playfair Display';letter-spacing:-.5px}
h1 em{font-style:italic;color:#e9cf96}
p{font:300 30px/1.45 Poppins;margin-top:34px;color:#e8dfcc}
.foot{position:absolute;bottom:66px;left:0;right:0;text-align:center;color:#f3ead8;z-index:4}
.zj{font:400 40px 'Playfair Display';color:#d6b46e;line-height:1}
.zn{font:400 22px Poppins;letter-spacing:.5em;margin-top:8px;padding-left:.5em}
.zs{font:300 13px Poppins;letter-spacing:.6em;color:#d6b46e;margin-top:4px;padding-left:.6em}
</style></head><body><div class="card">
<div class="photo"><img src="FOTO"></div>
<div class="panel"></div>
<div class="frame"></div>
<div class="spark" style="left:11px;top:712px"><svg viewBox="0 0 40 40"><path d="M20 0 C21 14 26 19 40 20 C26 21 21 26 20 40 C19 26 14 21 0 20 C14 19 19 14 20 0Z" fill="#d6b46e"/></svg></div>
<div class="spark" style="right:11px;top:712px"><svg viewBox="0 0 40 40"><path d="M20 0 C21 14 26 19 40 20 C26 21 21 26 20 40 C19 26 14 21 0 20 C14 19 19 14 20 0Z" fill="#d6b46e"/></svg></div>
<div class="spark" style="left:523px;bottom:11px"><svg viewBox="0 0 40 40"><path d="M20 0 C21 14 26 19 40 20 C26 21 21 26 20 40 C19 26 14 21 0 20 C14 19 19 14 20 0Z" fill="#d6b46e"/></svg></div>
<div class="badge"><b>É HOJE!</b> &nbsp;·&nbsp; BLACK FRIDAY ZEMORA</div>
<div class="content">
 <div class="rule"><i></i><s></s><i></i></div>
 <h1>O brilho que você ama, com <em>oportunidades imperdíveis!</em></h1>
 <p>Nossa Black Friday já começou. Aproveite!</p>
</div>
<div class="foot"><div class="zj">Zj</div><div class="zn">ZEMORA</div><div class="zs">JOIAS</div></div>
</div></body></html>
