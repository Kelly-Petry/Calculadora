<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#0f3d2b}
.card{position:relative;width:1080px;height:1350px;background:#0f3d2b}
.photo{position:absolute;top:0;left:0;width:1080px;height:930px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:var(--pos)}

.panel{position:absolute;top:760px;left:0;right:0;bottom:0;
 background:linear-gradient(rgba(15,61,43,0) 0,rgba(15,61,43,.8) 110px,#0f3d2b 170px,#0b2e20 100%)}
.frame{position:absolute;inset:28px;border:1.5px solid rgba(214,180,110,.75);pointer-events:none;z-index:5}
.spark{position:absolute;width:34px;height:34px;z-index:6}
.spark svg{width:100%;height:100%}
.badge{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:4;
 background:#0f3d2b;color:#f3ead8;font:500 22px Montserrat;letter-spacing:.32em;padding:16px 34px 16px 40px;white-space:nowrap}
.badge b{color:#d6b46e;font-weight:500}
.logo{position:absolute;top:84px;right:64px;text-align:center;color:#f3ead8;z-index:4;display:none}
.content{position:absolute;top:905px;left:70px;right:70px;text-align:center;color:#f3ead8;z-index:4}
.kick{font:500 20px Montserrat;letter-spacing:.38em;margin-bottom:22px;color:#d6b46e;text-transform:uppercase}
.rule{display:flex;align-items:center;justify-content:center;gap:18px;margin:0 0 34px}
.rule i{display:block;width:120px;height:1px;background:rgba(214,180,110,.7)}
.rule s{width:9px;height:9px;background:#d6b46e;transform:rotate(45deg)}
h1{font:400 74px/1.06 'EB Garamond';letter-spacing:-.5px}
h1 em{font-style:italic;color:#e9cf96}
p{font:300 26px/1.5 Montserrat;margin-top:24px;color:#e8dfcc}
.foot{position:absolute;bottom:52px;left:0;right:0;text-align:center;color:#f3ead8;z-index:4}
.zj{font:400 40px 'EB Garamond';color:#d6b46e;line-height:1}
.zn{font:400 22px Montserrat;letter-spacing:.5em;margin-top:8px;padding-left:.5em}
.zs{font:300 13px Montserrat;letter-spacing:.6em;color:#d6b46e;margin-top:4px;padding-left:.6em}
</style></head><body><div class="card">
<div class="photo"><img src="FOTO"></div>
<div class="panel"></div>
<div class="content">
 <h1>O brilho que você ama, com <em>oportunidades imperdíveis!</em></h1>
 <p>Nossa Black Friday já começou. Aproveite!</p>
</div>
<div class="foot"><img src="logo-zemora-creme.png" style="width:240px"></div>
</div></body></html>
