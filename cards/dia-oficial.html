<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:{{H}}px;overflow:hidden;background:#0f4a33;color:#f3ead8;font-family:Montserrat}
.wrap{position:relative;height:100%;padding:{{PADT}}px 70px {{PADB}}px;display:flex;flex-direction:column}
.kick{font:500 {{KS}}px/1 Montserrat;letter-spacing:.3em;color:#e3c787}
.big{position:relative;margin-top:{{G1}}px;font:800 {{BS}}px/.9 Montserrat;letter-spacing:-6px;color:#f3ead8}
.big span{display:block}
.badge{position:absolute;left:{{BL}}px;top:{{BT}}px;background:#0f4a33;padding:{{BP}}px {{BPX}}px;box-shadow:0 10px 26px rgba(15,74,51,.35)}
.badge img{display:block;width:{{LW}}px}
.row{display:flex;justify-content:flex-end;margin-top:{{G2}}px}
.sub{position:relative;z-index:2;text-align:right;font:400 {{SS}}px/1.15 Montserrat;color:#f3ead8}
.sub b{font-weight:800}
.ph{position:relative;flex:1;margin-top:{{G3}}px;min-height:0}
.ph .cut{position:absolute;left:-95px;top:0;height:100%;width:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.ring{position:absolute;width:{{RW}}px;height:{{RW}}px;left:-34px;top:-{{RT}}px;border-radius:50%;background:#0f4a33;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.ring svg{width:100%;height:100%}
.ring text{font:500 17px Montserrat;fill:#f3ead8}
.foot{text-align:center;margin-top:{{G4}}px}.foot img{width:{{LW}}px}
.ph .rings{position:absolute;right:{{RR}}px;bottom:{{RB}}px;height:{{RH}}%;width:auto;filter:drop-shadow(0 16px 26px rgba(0,0,0,.4))}
</style></head><body><div class="wrap">
<div class="kick">HOJE É O DIA OFICIAL DA</div>
<div class="big"><span>BLACK</span><span>FRIDAY</span></div>
<div class="row"><div class="sub">As melhores<br><b>ofertas Zemora</b><br>estão te esperando</div></div>
<div class="ph"><img class="cut" src="mao-recortada.png"><img class="rings" src="aneis-recortados.png">
</div>
<div class="foot"><img src="logo-zemora-creme.png"></div>
</div></body></html>
