<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:{{H}}px;overflow:hidden;background:#0f4a33;font-family:Montserrat;color:#f3ead8}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;padding:{{PADT}}px 44px {{PADB}}px;text-align:center}
.logo{width:{{LOGOW}}px}
.kick{margin-top:{{GAP1}}px;font:500 {{KS}}px/1 Montserrat;letter-spacing:.3em;text-transform:uppercase;color:#a88545}
h1{margin-top:{{GAP1}}px;font:700 {{TS}}px/1.1 Montserrat;letter-spacing:-1px}
.grid{flex:1;width:100%;margin:{{GAP2}}px 0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:{{ROWS}};gap:10px;min-height:0}
.grid div{overflow:hidden;border-radius:4px}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.a{grid-column:span 2}.b{grid-column:span 3}
.q{font:500 {{QS}}px/1.2 Montserrat}
.cta{margin-top:18px;background:#f3ead8;color:#0f4a33;font:500 {{CS}}px/1 Montserrat;letter-spacing:.25em;text-transform:uppercase;padding:18px 34px 18px 40px}
</style></head><body><div class="wrap">
<img class="logo" src="logo-zemora-creme.png">
<h1>Seus queridinhos estão com<br>condições especiais!</h1>
<div class="grid">
 <div class="a"><img src="anel2.png" style="object-position:50% 45%"></div>
 <div class="a"><img src="anel5.png" style="object-position:50% 55%"></div>
 <div class="a"><img src="anel4.png" style="object-position:50% 55%"></div>
 <div class="b"><img src="anel1.png" style="object-position:40% 55%"></div>
 <div class="b"><img src="anel3.png" style="object-position:50% 50%"></div>
</div>
<div class="q">Qual deles vai para o seu carrinho?</div>
<div class="cta">Acesse o link da bio</div>
</div></body></html>
