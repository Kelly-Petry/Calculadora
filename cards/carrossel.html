<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#000}
.photo{position:absolute;inset:0}
.photo img{width:100%;height:100%;object-fit:cover;object-position:{{POS}}}
.logo{position:absolute;top:54px;left:0;right:0;text-align:center}
.logo img{width:180px}
.content{position:absolute;left:70px;right:70px;{{VPOS}};text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
h1{font:800 {{TS}}px/1.02 Montserrat;letter-spacing:-2px;color:#fbf5e9;text-shadow:0 2px 24px rgba(20,10,5,.55),0 1px 4px rgba(20,10,5,.5)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:880px}
.hl{background:#0f4a33;color:#f3ead8;font:500 30px/1 Montserrat;padding:16px 26px}
.sub{font:500 30px/1.9 Montserrat;color:#f3ead8}
.sub span{background:#0f4a33;padding:10px 22px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.emoji{font-family:'Noto Color Emoji';text-shadow:none}
h1.dark{color:#0f4a33;text-shadow:0 1px 18px rgba(255,250,240,.55)}
h1.thin{font-weight:300;letter-spacing:-1px;text-shadow:0 1px 16px rgba(255,250,240,.6)}
h1.thin b{font-weight:600}
.kick-thin{font:600 26px/1 Montserrat;letter-spacing:.35em;color:#0f4a33;text-shadow:0 1px 10px rgba(255,250,240,.7)}
.thin-sub span{font-weight:300;letter-spacing:.08em}
.thin-chips .hl{font-weight:300;letter-spacing:.05em}
.price{background:#0f4a33;color:#f3ead8;font:500 56px/1 Montserrat;letter-spacing:.02em;padding:24px 44px}
.midbox{background:#0f4a33;color:#f3ead8;font:400 50px/1.3 Montserrat;padding:40px 56px;text-align:center}
.midbox b{font-weight:700}
.corner{position:fixed;right:56px;bottom:60px;background:#0f4a33;color:#f3ead8;font:300 30px/1.25 Montserrat;padding:22px 30px;text-align:left;border-radius:22px}
.corner b{font-weight:700;font-size:36px}
</style></head><body>
<div class="photo"><img src="{{FOTO}}" style="{{IMGSTYLE}}"></div>
<div class="content">{{BODY}}</div>
<div class="logo"><img src="{{LOGO}}"></div>
</body></html>
